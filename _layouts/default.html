<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2A1A5E">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/inter-400.woff' | relative_url }}" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/inter-600.woff' | relative_url }}" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/kite-icon.png' | relative_url }}" alt="" width="44" height="44">
      <span>Kite</span>
    </a>
    <nav aria-label="Pages">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
    </nav>
  </header>
  <main id="main">
{{ content }}
  </main>
  <footer class="site-footer">
    <p>Kite has no account and no server. Questions: <a href="mailto:kakodjenou@gmail.com">kakodjenou@gmail.com</a></p>
  </footer>
</body>
</html>
